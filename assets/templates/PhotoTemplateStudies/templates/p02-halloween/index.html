 function shade(hex,factor){return '#'+hex.slice(1).match(/../g).map(n=>Math.round(parseInt(n,16)*factor).toString(16).padStart(2,'0')).join('')}
 function mix(a,b,t){return '#'+[0,2,4].map(i=>Math.round(parseInt(a.slice(i+1,i+3),16)*(1-t)+parseInt(b.slice(i+1,i+3),16)*t).toString(16).padStart(2,'0')).join('')}
 function fitText(node,size,max){const spacing=node.id==='theme-text'?5:node.id==='credit-text'?3:0;node.setAttribute('font-size',size);node.setAttribute('letter-spacing',spacing);const width=node.getComputedTextLength();if(width>max){const ratio=max/width;node.setAttribute('font-size',Math.max(1,size*ratio));node.setAttribute('letter-spacing',spacing*ratio);}}
 function render(){
  poster.style.setProperty('--ink',state.main);poster.style.setProperty('--cream',state.cyan);poster.style.setProperty('--paper',state.bg);
  $('headline').textContent=state.title;$('headline').setAttribute('y',state.titleY*16);$('headline').setAttribute('fill',state.main);fitText($('headline'),state.titleSize,1000);
  $('theme-text').textContent=state.theme;fitText($('theme-text'),19,1000);$('credit-text').textContent=state.credit;fitText($('credit-text'),20,1000);
  $('background').setAttribute('fill',state.bg);$('small-type').setAttribute('fill',state.main);
  $('placeholder-character').querySelectorAll('[data-accent]').forEach(n=>n.setAttribute('fill',state.accent));
  for(const id of ['lamp-layer','platform-layer','decoration-layer'])$(id).setAttribute('transform',state.mirror?'translate(1200 0) scale(-1 1)':'');
  const x=state.x*12,y=state.y*16,scale=state.scale/100;
  $('character-layer').setAttribute('transform',`translate(${x} ${y}) scale(${state.mirror?-scale:scale} ${scale})`);$('foot-guide').setAttribute('d',`M${x-250} ${y}H${x+250}`);
  $('title-size-value').textContent=state.titleSize;$('title-y-value').textContent=state.titleY+'%';$('hero-x-value').textContent=state.x+'%';$('hero-y-value').textContent=state.y+'%';$('hero-scale-value').textContent=state.scale+'%';
  for(const key of ['bg','main','cyan','accent'])$(key+'-hex').textContent=state[key].toUpperCase();
  for(const [input,layer]of Object.entries(layers))$(layer).style.display=$(input).checked?'':'none';
  $('poster-title').textContent=(state.title||'无标题')+' 角色海报';
  poster.insertBefore($('headline'),state.titleLayer==='back'?$('character-layer'):$('decoration-layer'));$('layer-note').textContent=state.titleLayer==='back'?'标题在人物后方':'标题在人物前方';
  $('export-meta').textContent='3:4 · 导出 '+state.exportSize.replace('x',' × ');
  if(!exporting)$('status').textContent=y-694*scale<175?'人物接近顶部标题，可缩小人物、下移人物或调整标题位置。':'';
 }
 function sync(){for(const[id,key]of Object.entries(fields)){if($(id).type==='checkbox')$(id).checked=state[key];else $(id).value=state[key]}render()}
 function clearPalette(){document.querySelectorAll('[data-palette]').forEach(b=>b.setAttribute('aria-pressed','false'))}
 for(const[id,key]of Object.entries(fields))$(id).addEventListener('input',e=>{if(key==='mirror'){state.x=100-state.x;$('hero-x').value=state.x;}state[key]=e.target.type==='checkbox'?e.target.checked:e.target.type==='range'?Number(e.target.value):e.target.value;if(e.target.type==='color')clearPalette();render()});
 for(const id of Object.keys(layers))$(id).addEventListener('change',render);
 document.querySelectorAll('[data-palette]').forEach(button=>button.addEventListener('click',()=>{Object.assign(state,palettes[button.dataset.palette]);clearPalette();button.setAttribute('aria-pressed','true');sync()}));
 function clearCharacter(){customImage=null;assetMeta=null;$('custom-character').style.display='none';$('custom-character').removeAttribute('href');$('placeholder-character').style.display='';$('character-file').value='';$('asset-note').textContent='几何魔女占位 · 导入透明 PNG 替换'}
 $('reset').addEventListener('click',()=>{state={...defaults};clearCharacter();for(const id of Object.keys(layers))$(id).checked=!['show-guides','show-cloud'].includes(id);clearPalette();document.querySelector('[data-palette="original"]').setAttribute('aria-pressed','true');sync()});
 function svgPoint(event){const matrix=poster.getScreenCTM();return new DOMPoint(event.clientX,event.clientY).matrixTransform(matrix.inverse())}
 $('character-layer').addEventListener('pointerdown',e=>{if(e.button!==0)return;const p=svgPoint(e);drag={id:e.pointerId,dx:p.x-state.x*12,dy:p.y-state.y*16};poster.setPointerCapture(e.pointerId);e.preventDefault()});
 poster.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const p=svgPoint(e);state.x=Math.round(Math.min(85,Math.max(15,(p.x-drag.dx)/12))*2)/2;state.y=Math.round(Math.min(95,Math.max(45,(p.y-drag.dy)/16))*2)/2;$('hero-x').value=state.x;$('hero-y').value=state.y;render()});
 for(const type of ['pointerup','pointercancel'])poster.addEventListener(type,e=>{if(drag&&drag.id===e.pointerId){drag=null;if(poster.hasPointerCapture(e.pointerId))poster.releasePointerCapture(e.pointerId)}});
 async function useCharacter(data){
  if(typeof data!=='string'||!/^data:image\/png;base64,[a-zA-Z0-9+/=\r\n]+$/.test(data)||data.length>45000000)throw Error('人物素材必须是有效的 PNG，且文件体积适合本地方案。');
  const image=new Image();image.src=data;await image.decode();if(image.width*image.height>36000000)throw Error('请使用不超过 3600 万像素的 PNG。');
  const c=document.createElement('canvas');c.width=image.width;c.height=image.height;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(image,0,0);const pixels=ctx.getImageData(0,0,c.width,c.height).data;let left=c.width,top=c.height,right=-1,bottom=-1,transparent=0;
  for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){const alpha=pixels[(y*c.width+x)*4+3];if(alpha<255)transparent++;if(alpha>8){left=Math.min(left,x);right=Math.max(right,x);top=Math.min(top,y);bottom=Math.max(bottom,y)}}
  if(right<left)throw Error('这张图片完全透明。');const trimmed=document.createElement('canvas');trimmed.width=right-left+1;trimmed.height=bottom-top+1;trimmed.getContext('2d').drawImage(c,left,top,trimmed.width,trimmed.height,0,0,trimmed.width,trimmed.height);
  customImage=trimmed.toDataURL('image/png');assetMeta={sourceWidth:image.width,sourceHeight:image.height,width:trimmed.width,height:trimmed.height};
  const h=694,w=Math.min(650,h*trimmed.width/trimmed.height),visualH=w*trimmed.height/trimmed.width,node=$('custom-character');node.setAttribute('x',-w/2);node.setAttribute('y',-visualH);node.setAttribute('width',w);node.setAttribute('height',visualH);node.setAttribute('href',customImage);node.style.display='';$('placeholder-character').style.display='none';
  $('asset-note').textContent=`人物素材 ${trimmed.width} × ${trimmed.height} px · 仅裁透明空边，未缩小像素`;
  return transparent>0;
 }
 $('character-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.type!=='image/png')throw Error('请选择 PNG 图片。');const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('图片读取失败。'));reader.readAsDataURL(file)});const transparent=await useCharacter(data);$('show-character').checked=true;render();$('status').textContent=transparent?'角色已替换。保存方案可连同 PNG 一起保留。':'未检测到透明区域，原图背景也会保留。'}catch(error){$('status').textContent=error.message}});
 function filename(extension){return 'P02-'+(state.title.trim().replace(/[\\/:*?"<>|]/g,'').slice(0,30)||'poster')+'.'+extension}
 function downloadBlob(blob,name){const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),15000)}
 $('save-project').addEventListener('click',()=>{const project={type:'p02-project',version:1,state:{...state},layers:Object.fromEntries(Object.keys(layers).map(id=>[id,$(id).checked])),image:customImage,assetMeta};downloadBlob(new Blob([JSON.stringify(project,null,2)],{type:'application/json'}),filename('json'));$('status').textContent='已保存方案，包含当前人物素材、文字、配色、位置与图层。'});
 $('open-project').addEventListener('click',()=>{$('project-file').value='';$('project-file').click()});
 $('project-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{
  if(file.size>45000000)throw Error('方案文件超过 45 MB。');const project=JSON.parse(await file.text());if(project.type!=='p02-project'||project.version!==1||!project.state||typeof project.state!=='object')throw Error('这不是支持的 P02 方案文件。');
  const next={...defaults};for(const[id,key]of Object.entries(fields)){const value=project.state[key];if(value===undefined)continue;const input=$(id);if(input.type==='checkbox'){if(typeof value!=='boolean')throw Error('镜像选项无效。');next[key]=value}else if(input.type==='range'){if(typeof value!=='number'||!Number.isFinite(value))throw Error('方案中的数值无效。');next[key]=Math.min(Number(input.max),Math.max(Number(input.min),value))}else if(input.type==='color'){if(typeof value!=='string'||!/^#[0-9a-f]{6}$/i.test(value))throw Error('方案中的颜色无效。');next[key]=value}else if(input.tagName==='SELECT'){if(!Array.from(input.options).some(o=>o.value===value))throw Error('方案中的选项无效。');next[key]=value}else{if(typeof value!=='string')throw Error('方案中的文字无效。');next[key]=value.slice(0,input.maxLength)}}
  if(project.image!==null&&project.image!==undefined)await useCharacter(project.image);else clearCharacter();state=next;for(const id of Object.keys(layers))$(id).checked=typeof project.layers?.[id]==='boolean'?project.layers[id]:!['show-guides','show-cloud'].includes(id);clearPalette();sync();$('status').textContent='方案已恢复，可继续编辑并导出。';
 }catch(error){$('status').textContent='读取失败：'+error.message}});
 $('export').addEventListener('click',async()=>{
  if(exporting)return;exporting=true;const button=$('export');button.disabled=true;button.textContent='正在导出…';
  try{await document.fonts.ready;const [width,height]=state.exportSize.split('x').map(Number);const clone=poster.cloneNode(true);clone.setAttribute('width',String(width));clone.setAttribute('height',String(height));clone.querySelector('#guide-layer').remove();clone.querySelector('#character-layer').removeAttribute('aria-label');const xml=new XMLSerializer().serializeToString(clone),source=new Blob([xml],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(source);try{const image=new Image();image.src=url;await image.decode();const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;canvas.getContext('2d').drawImage(image,0,0,width,height);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('PNG 生成失败。');downloadBlob(blob,filename('png'));$('status').textContent=`已生成 ${width} × ${height} PNG，辅助线不会出现在图片中。`;}finally{URL.revokeObjectURL(url)}}catch(error){$('status').textContent='导出失败：'+error.message}finally{exporting=false;button.disabled=false;button.textContent='导出 PNG'}
 });
 document.fonts.ready.then(render);sync();
})();
</script>
