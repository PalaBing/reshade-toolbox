<script>
(()=>{
 'use strict';
 const $=id=>document.getElementById(id);
 const poster=$('poster');
 const defaults={title:'JOURNEY',theme:'CHARACTER STUDY',credit:'FFXIV · HALLOWEEN',titleSize:352,titleY:59,bg:'#f2f2f2',main:'#c78080',cyan:'#64c2cc',accent:'#edc801',x:51,y:76,scale:100,titleLayer:'front',exportSize:'3840x2160'};
 const palettes={original:{bg:'#f2f2f2',main:'#c78080',cyan:'#64c2cc',accent:'#edc801'},sage:{bg:'#f3f0e9',main:'#8b9a88',cyan:'#ba866b',accent:'#c4a65a'},blue:{bg:'#f0f2f4',main:'#8299b3',cyan:'#d6a46d',accent:'#cc967d'},witch:{bg:'#e9e2ee',main:'#67477d',cyan:'#ce6b29',accent:'#d7ac55'}};
 let state={...defaults},customImage=null,assetMeta=null,drag=null,exporting=false;
 const fields={'title-input':'title','theme-input':'theme','credit-input':'credit','title-size':'titleSize','title-y':'titleY','bg-color':'bg','main-color':'main','cyan-color':'cyan','accent-color':'accent','hero-x':'x','hero-y':'y','hero-scale':'scale','title-layer':'titleLayer','export-size':'exportSize'};
 const layers={'show-grid':'grid-layer','show-character':'character-layer','show-platform':'platform-layer','show-decoration':'decoration-layer','show-cloud':'cloud-layer','show-guides':'guide-layer'};
 function shade(hex,factor){return '#'+hex.slice(1).match(/../g).map(n=>Math.round(parseInt(n,16)*factor).toString(16).padStart(2,'0')).join('')}
 function mix(a,b,t){return '#'+[0,2,4].map(i=>Math.round(parseInt(a.slice(i+1,i+3),16)*(1-t)+parseInt(b.slice(i+1,i+3),16)*t).toString(16).padStart(2,'0')).join('')}
 function fitText(node,size,max){const spacing=node.id==='theme-text'?15:node.id==='credit-text'?-2:0;node.setAttribute('font-size',size);node.setAttribute('letter-spacing',spacing);const width=node.getComputedTextLength();if(width>max){const ratio=max/width;node.setAttribute('font-size',Math.max(1,size*ratio));node.setAttribute('letter-spacing',spacing*ratio);}}
 function render(){
  $('headline').textContent=state.title;$('headline').setAttribute('y',state.titleY*10.8);$('headline').setAttribute('fill',state.main);fitText($('headline'),state.titleSize,1600);
  $('theme-text').textContent=state.theme;$('theme-text').setAttribute('fill',shade(state.main,.78));fitText($('theme-text'),29,610);
  $('credit-text').textContent=state.credit;$('credit-text').setAttribute('fill',state.cyan);fitText($('credit-text'),65,480);
  $('background').setAttribute('fill',state.bg);$('orb').setAttribute('fill',state.cyan);$('yellow-circle').setAttribute('fill',state.accent);$('yellow-line').setAttribute('stroke',state.accent);$('stars').setAttribute('stroke',mix(state.accent,state.bg,.56));
  const x=state.x*19.2,y=state.y*10.8,scale=state.scale/100;
  $('character-layer').setAttribute('transform',`translate(${x} ${y}) scale(${scale})`);$('platform-layer').setAttribute('transform',`translate(${x} ${y}) scale(${.87+.13*scale})`);$('foot-guide').setAttribute('d',`M${x-280} ${y}H${x+280}`);
  $('title-size-value').textContent=state.titleSize;$('title-y-value').textContent=state.titleY+'%';$('hero-x-value').textContent=state.x+'%';$('hero-y-value').textContent=state.y+'%';$('hero-scale-value').textContent=state.scale+'%';
  for(const key of ['bg','main','cyan','accent'])$(key+'-hex').textContent=state[key].toUpperCase();
  for(const [input,layer]of Object.entries(layers))$(layer).style.display=$(input).checked?'':'none';
  $('poster-title').textContent=(state.title||'无标题')+' 角色海报原型';
  const headline=$('headline');poster.insertBefore(headline,state.titleLayer==='back'?$('character-layer'):$('decoration-layer'));$('layer-note').textContent=state.titleLayer==='back'?'文字在人物后方':'文字在人物前方';
  $('export-meta').textContent='16:9 · 导出 '+state.exportSize.replace('x',' × ');
  const head=y-694*scale,baseline=state.titleY*10.8;
  let warning='';if(head<25)warning='人物头顶接近画布边缘，可以向下移动或缩小。';else if(baseline-state.titleSize*.7<y-510*scale)warning='标题接近面部，可以下移标题或调整人物大小。';
  if(!exporting)$('status').textContent=warning;
 }
 function sync(){for(const[id,key]of Object.entries(fields))$(id).value=state[key];render()}
 function clearPalette(){document.querySelectorAll('[data-palette]').forEach(b=>b.setAttribute('aria-pressed','false'))}
 for(const[id,key]of Object.entries(fields))$(id).addEventListener('input',e=>{state[key]=e.target.type==='range'?Number(e.target.value):e.target.value;if(e.target.type==='color')clearPalette();render()});
 for(const id of Object.keys(layers))$(id).addEventListener('change',render);
 document.querySelectorAll('[data-palette]').forEach(button=>button.addEventListener('click',()=>{Object.assign(state,palettes[button.dataset.palette]);clearPalette();button.setAttribute('aria-pressed','true');sync()}));
 function clearCharacter(){customImage=null;assetMeta=null;$('custom-character').style.display='none';$('custom-character').removeAttribute('href');$('placeholder-character').style.display='';$('character-file').value='';$('asset-note').textContent='原创几何人物与地台占位 · 可直接拖动人物'}
 $('reset').addEventListener('click',()=>{state={...defaults};clearCharacter();for(const id of Object.keys(layers))$(id).checked=id!=='show-guides';clearPalette();document.querySelector('[data-palette="original"]').setAttribute('aria-pressed','true');sync()});
 function svgPoint(event){const matrix=poster.getScreenCTM();return new DOMPoint(event.clientX,event.clientY).matrixTransform(matrix.inverse())}
 $('character-layer').addEventListener('pointerdown',e=>{if(e.button!==0)return;const p=svgPoint(e);drag={id:e.pointerId,dx:p.x-state.x*19.2,dy:p.y-state.y*10.8};poster.setPointerCapture(e.pointerId);e.preventDefault()});
 poster.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const p=svgPoint(e);state.x=Math.round(Math.min(66,Math.max(34,(p.x-drag.dx)/19.2))*2)/2;state.y=Math.round(Math.min(88,Math.max(66,(p.y-drag.dy)/10.8))*2)/2;$('hero-x').value=state.x;$('hero-y').value=state.y;render()});
 for(const type of ['pointerup','pointercancel'])poster.addEventListener(type,e=>{if(drag&&drag.id===e.pointerId){drag=null;if(poster.hasPointerCapture(e.pointerId))poster.releasePointerCapture(e.pointerId)}});
 async function useCharacter(data){
  if(typeof data!=='string'||!/^data:image\/png;base64,[a-zA-Z0-9+/=\r\n]+$/.test(data)||data.length>45000000)throw Error('人物素材必须是有效的 PNG，且文件体积适合本地方案。');
  const image=new Image();image.src=data;await image.decode();if(image.width*image.height>36000000)throw Error('请使用不超过 3600 万像素的 PNG。');
  const c=document.createElement('canvas');c.width=image.width;c.height=image.height;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(image,0,0);const pixels=ctx.getImageData(0,0,c.width,c.height).data;let left=c.width,top=c.height,right=-1,bottom=-1,transparent=0;
  for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){const alpha=pixels[(y*c.width+x)*4+3];if(alpha<255)transparent++;if(alpha>8){left=Math.min(left,x);right=Math.max(right,x);top=Math.min(top,y);bottom=Math.max(bottom,y)}}
  if(right<left)throw Error('这张图片完全透明。');const trimmed=document.createElement('canvas');trimmed.width=right-left+1;trimmed.height=bottom-top+1;trimmed.getContext('2d').drawImage(c,left,top,trimmed.width,trimmed.height,0,0,trimmed.width,trimmed.height);
  customImage=trimmed.toDataURL('image/png');assetMeta={sourceWidth:image.width,sourceHeight:image.height,width:trimmed.width,height:trimmed.height};
  const h=694,w=Math.min(900,h*trimmed.width/trimmed.height),visualH=w*trimmed.height/trimmed.width,node=$('custom-character');node.setAttribute('x',-w/2);node.setAttribute('y',-visualH);node.setAttribute('width',w);node.setAttribute('height',visualH);node.setAttribute('href',customImage);node.style.display='';$('placeholder-character').style.display='none';
  $('asset-note').textContent=`人物素材 ${trimmed.width} × ${trimmed.height} px · 仅裁透明空边，未缩小像素`;
  return transparent>0;
 }
 $('character-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.type!=='image/png')throw Error('请选择 PNG 图片。');const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('图片读取失败。'));reader.readAsDataURL(file)});const transparent=await useCharacter(data);$('show-character').checked=true;render();$('status').textContent=transparent?'角色已替换。保存方案可连同 PNG 一起保留。':'未检测到透明区域，原图背景也会保留。'}catch(error){$('status').textContent=error.message}});
 function filename(extension){return 'P01-'+(state.title.trim().replace(/[\\/:*?"<>|]/g,'').slice(0,30)||'poster')+'.'+extension}
 function downloadBlob(blob,name){const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),15000)}
 $('save-project').addEventListener('click',()=>{const project={type:'p01-project',version:1,state:{...state},layers:Object.fromEntries(Object.keys(layers).map(id=>[id,$(id).checked])),image:customImage,assetMeta};downloadBlob(new Blob([JSON.stringify(project,null,2)],{type:'application/json'}),filename('json'));$('status').textContent='已保存方案，包含当前人物素材、文字、配色、位置与图层。'});
 $('open-project').addEventListener('click',()=>{$('project-file').value='';$('project-file').click()});
 $('project-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{
  if(file.size>45000000)throw Error('方案文件超过 45 MB。');const project=JSON.parse(await file.text());if(project.type!=='p01-project'||project.version!==1||!project.state||typeof project.state!=='object')throw Error('这不是支持的 P01 方案文件。');
  const next={...defaults};for(const[id,key]of Object.entries(fields)){const value=project.state[key];if(value===undefined)continue;const input=$(id);if(input.type==='range'){if(typeof value!=='number'||!Number.isFinite(value))throw Error('方案中的数值无效。');next[key]=Math.min(Number(input.max),Math.max(Number(input.min),value))}else if(input.type==='color'){if(typeof value!=='string'||!/^#[0-9a-f]{6}$/i.test(value))throw Error('方案中的颜色无效。');next[key]=value}else if(input.tagName==='SELECT'){if(!Array.from(input.options).some(o=>o.value===value))throw Error('方案中的选项无效。');next[key]=value}else{if(typeof value!=='string')throw Error('方案中的文字无效。');next[key]=value.slice(0,input.maxLength)}}
  if(project.image!==null&&project.image!==undefined)await useCharacter(project.image);else clearCharacter();state=next;for(const id of Object.keys(layers))$(id).checked=typeof project.layers?.[id]==='boolean'?project.layers[id]:id!=='show-guides';clearPalette();sync();$('status').textContent='方案已恢复，可继续编辑并导出。';
 }catch(error){$('status').textContent='读取失败：'+error.message}});
 $('export').addEventListener('click',async()=>{
  if(exporting)return;exporting=true;const button=$('export');button.disabled=true;button.textContent='正在导出…';
  try{await document.fonts.ready;const [width,height]=state.exportSize.split('x').map(Number);const clone=poster.cloneNode(true);clone.setAttribute('width',String(width));clone.setAttribute('height',String(height));clone.querySelector('#guide-layer').remove();clone.querySelector('#character-layer').removeAttribute('aria-label');const xml=new XMLSerializer().serializeToString(clone),source=new Blob([xml],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(source);try{const image=new Image();image.src=url;await image.decode();const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;canvas.getContext('2d').drawImage(image,0,0,width,height);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('PNG 生成失败。');downloadBlob(blob,filename('png'));$('status').textContent=`已生成 ${width} × ${height} PNG，辅助线不会出现在图片中。`;}finally{URL.revokeObjectURL(url)}}catch(error){$('status').textContent='导出失败：'+error.message}finally{exporting=false;button.disabled=false;button.textContent='导出 PNG'}
 });
 document.fonts.ready.then(render);render();
})();
