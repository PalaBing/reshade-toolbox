<g id="guide-layer" style="display:none" fill="none" stroke="#75bbcc" stroke-width="2" stroke-dasharray="8 8" pointer-events="none"><rect x="60" y="60" width="1080" height="1480"></rect><path id="foot-guide" d="M554 1472H1054"></path></g>
