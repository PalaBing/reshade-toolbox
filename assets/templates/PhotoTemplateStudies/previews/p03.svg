 <g id="stars-layer" fill="var(--gold)" color="var(--gold)"><use href="#diamond" transform="translate(817 344) scale(1.2)"></use><use href="#diamond" transform="translate(192 505) scale(.55)"></use><use href="#diamond" transform="translate(1021 271) scale(.6)"></use><use href="#diamond" transform="translate(1111 463) scale(.6)"></use><use href="#asterisk" transform="translate(105 812)"></use><path d="M105 744V887M44 555V730M1156 495V1016" stroke="var(--gold)" stroke-width="1" stroke-dasharray="2 7"></path><circle cx="105" cy="754" r="2"></circle><circle cx="984" cy="316" r="2"></circle><circle cx="1156" cy="1027" r="2"></circle><use href="#diamond" transform="translate(105 888) scale(.4)"></use><use href="#diamond" transform="translate(44 747) scale(.5)"></use></g>
