<svg id="poster" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600" role="img" aria-labelledby="poster-title poster-description" style="--cream: #fff0ce; --gold: #d9b574; --ink: #19131c;">
<title id="poster-title">CRIMSON SOIRÉE · 绯红夜宴</title><desc id="poster-description">可编辑的绯红夜宴邀请函。右侧拱窗用于放置透明角色 PNG，人物可越过拱框。</desc>
<defs>
 <path id="diamond" d="M0-16Q3-3 10 0Q3 3 0 16Q-3 3-10 0Q-3-3 0-16Z"></path><path id="bat" d="M-76-26Q-43-14-23 5L-11 3L-7-12L1-3L8-13L13 1L25 3Q46-15 76-26Q59-3 57 14Q39 4 30 23Q14 12 1 35Q-14 13-30 23Q-40 4-58 14Q-59-6-76-26Z"></path>
